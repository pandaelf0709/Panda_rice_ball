<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="飯飯都掂">
    <title>飯飯都掂 🍚 - 私人美食地圖</title>
    <!-- Google Fonts 圓體字 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #FDFCF8;
            --card-bg: #FFFFFF;
            --text-main: #5C4033;
            --text-muted: #A89F91;
            --accent-color: #E6C7A2;
            --accent-hover: #DDC09B;
            --star-color: #FFC048;
            --border-radius-lg: 24px;
            --border-radius-sm: 12px;
            --shadow-soft: 4px 4px 0px #5C4033;
            --joguman-line: 2.5px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 100px;
            line-height: 1.5;
        }

        header {
            background-color: rgba(253, 252, 248, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 20px;
            border-bottom: var(--joguman-line) solid var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 吉祥物 SVG 樣式 */
        .mascot-svg {
            width: 55px;
            height: auto;
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 800;
            margin: 0;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        .search-box {
            width: 100%;
            background: var(--card-bg);
            border: var(--joguman-line) solid var(--text-main);
            padding: 12px 18px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            box-shadow: 3px 3px 0px var(--text-main);
            margin-bottom: 16px;
        }

        .filter-group {
            margin-bottom: 14px;
        }

        .filter-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .tags-scroll {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-btn {
            background: #F4EBE1;
            color: var(--text-main);
            border: var(--joguman-line) solid var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--text-main);
            transition: all 0.1s ease;
        }

        .tag-btn.active {
            background: var(--text-main);
            color: #FFFFFF;
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 18px;
            border: var(--joguman-line) solid var(--text-main);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .card:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-main);
            margin: 0;
        }

        .stars {
            color: var(--star-color);
            font-size: 0.95rem;
            font-weight: bold;
            text-shadow: 1px 1px 0 var(--text-main);
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 800;
            background-color: #FAF0E6;
            border: 2px solid var(--text-main);
        }

        .card-preview {
            background-color: #FDF9F0;
            border-radius: var(--border-radius-sm);
            padding: 10px 12px;
            font-size: 0.9rem;
            color: var(--text-main);
            border: var(--joguman-line) solid var(--text-main);
        }

        .card-preview strong {
            color: #A0522D;
        }

        .provider-tag {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 700;
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: var(--accent-color);
            color: var(--text-main);
            border: var(--joguman-line) solid var(--text-main);
            border-radius: 30px;
            padding: 14px 20px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 900;
            box-shadow: 4px 4px 0px var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 90;
        }

        .fab:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(92, 64, 51, 0.5);
            backdrop-filter: blur(3px);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-container {
            background: var(--bg-color);
            width: 100%;
            max-width: 600px;
            max-height: 88vh;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border-left: var(--joguman-line) solid var(--text-main);
            border-right: var(--joguman-line) solid var(--text-main);
            border-top: var(--joguman-line) solid var(--text-main);
            padding: 24px 20px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #F4EBE1;
            border: var(--joguman-line) solid var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: 900;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .detail-section {
            background-color: var(--card-bg);
            border-radius: var(--border-radius-sm);
            border: var(--joguman-line) solid var(--text-main);
            padding: 12px 14px;
            margin-bottom: 12px;
            box-shadow: 2px 2px 0px var(--text-main);
        }

        .detail-section-title {
            font-size: 0.8rem;
            font-weight: 900;
            color: #A0522D;
            margin-bottom: 4px;
        }

        .detail-text {
            font-size: 0.92rem;
            margin: 0;
            white-space: pre-line;
        }

        .avoid-box {
            background-color: #FFF5F5;
            border-color: #C53030;
        }
        .avoid-box .detail-section-title {
            color: #C53030;
        }

        /* 按鈕群組 (編輯/刪除) */
        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: var(--joguman-line) solid var(--text-main);
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--text-main);
        }
        .btn-edit { background-color: #FFF3CD; }
        .btn-delete { background-color: #FFD1DC; color: #9B2C2C; }

        /* 留言區樣式 */
        .comment-item {
            background: #FDF9F0;
            border: 2px solid var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }
        .comment-author {
            font-weight: 900;
            color: #A0522D;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 900;
            margin-bottom: 4px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: var(--joguman-line) solid var(--text-main);
            border-radius: var(--border-radius-sm);
            font-family: inherit;
            font-size: 0.9rem;
            background: #FFF;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: var(--text-main);
            border: var(--joguman-line) solid var(--text-main);
            padding: 12px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--text-main);
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <!-- 熊貓與奶油臘腸狗吉祥物 SVG (Joguman x Woody 風格) -->
            <svg class="mascot-svg" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
                <!-- 熊貓頭 -->
                <circle cx="35" cy="30" r="20" fill="#FFFFFF" stroke="#5C4033" stroke-width="2.5"/>
                <circle cx="23" cy="16" r="7" fill="#5C4033"/>
                <circle cx="47" cy="16" r="7" fill="#5C4033"/>
                <ellipse cx="28" cy="27" rx="5" ry="7" fill="#5C4033" transform="rotate(-15 28 27)"/>
                <ellipse cx="42" cy="27" rx="5" ry="7" fill="#5C4033" transform="rotate(15 42 27)"/>
                <circle cx="28" cy="26" r="2" fill="#FFF"/>
                <circle cx="42" cy="26" r="2" fill="#FFF"/>
                <ellipse cx="35" cy="34" rx="3" ry="2" fill="#5C4033"/>
                <!-- 中間愛心飯糰 -->
                <path d="M60 22 C60 18, 66 18, 66 22 C66 26, 60 30, 60 30 C60 30, 54 26, 54 22 C54 18, 60 18, 60 22 Z" fill="#FFB6C1" stroke="#5C4033" stroke-width="2"/>
                <!-- 奶油咖啡色臘腸狗頭 -->
                <path d="M75 15 Q85 12 95 20 Q105 25 102 38 Q100 45 90 44 Q80 43 78 30 Z" fill="#DDC09B" stroke="#5C4033" stroke-width="2.5"/>
                <ellipse cx="80" cy="22" rx="4" ry="7" fill="#8B5E3C" transform="rotate(20 80 22)"/>
                <circle cx="92" cy="28" r="2" fill="#5C4033"/>
                <circle cx="101" cy="35" r="2.5" fill="#5C4033"/>
            </svg>
            <h1>飯飯都掂</h1>
        </div>
        <div class="subtitle">panda & doggy's food map 🍚</div>
    </header>

    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜尋店名、招牌、提供者..." oninput="renderList()">

        <div class="filter-group">
            <div class="filter-title">📍 地區篩選</div>
            <div class="tags-scroll" id="districtFilter"></div>
        </div>

        <div class="filter-group">
            <div class="filter-title">🍴 種類篩選</div>
            <div class="tags-scroll" id="categoryFilter"></div>
        </div>

        <div id="restaurantList" class="restaurant-list">
            <div class="empty-state">資料載入中...</div>
        </div>
    </div>

    <button class="fab" onclick="openAddModal()">
        <span>➕</span> 新增餐廳
    </button>

    <!-- 詳情 Modal -->
    <div id="detailModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'detailModal')">
        <div class="modal-container">
            <button class="modal-close" onclick="closeModal('detailModal')">✕</button>
            <div class="detail-header" style="padding-right:40px;">
                <h2 id="modalTitle" class="detail-title"></h2>
                <div id="modalStars" class="stars"></div>
                <div id="modalTags" class="card-tags" style="margin-top: 8px;"></div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">📍 地址</div>
                <p id="modalAddress" class="detail-text"></p>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">✨ 招牌 Preview</div>
                <p id="modalSignature" class="detail-text"></p>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">💚 推薦亮點</div>
                <p id="modalPros" class="detail-text"></p>
            </div>

            <div class="detail-section avoid-box">
                <div class="detail-section-title">⚠️ 避雷注意</div>
                <p id="modalCons" class="detail-text"></p>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">👤 提供者</div>
                <p id="modalProvider" class="detail-text"></p>
            </div>

            <!-- 朋友留言區 -->
            <div class="detail-section">
                <div class="detail-section-title">💬 朋友留言板</div>
                <div id="commentsList" style="margin-bottom: 10px;"></div>
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                    <input type="text" id="commentAuthor" class="form-input" placeholder="你的名字" style="flex: 1; padding: 6px 10px; font-size: 0.8rem;">
                    <input type="text" id="commentText" class="form-input" placeholder="寫個留言..." style="flex: 2; padding: 6px 10px; font-size: 0.8rem;">
                    <button class="tag-btn" onclick="addComment()">發送</button>
                </div>
            </div>

            <div class="action-btns">
                <button class="btn-action btn-edit" onclick="openEditModal()">✏️ 編輯</button>
                <button class="btn-action btn-delete" onclick="deleteRestaurant()">🗑️ 刪除</button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯 Modal -->
    <div id="addModal" class="modal-overlay" onclick="closeModalOnOverlay(event, 'addModal')">
        <div class="modal-container">
            <button class="modal-close" onclick="closeModal('addModal')">✕</button>
            <h2 id="formModalTitle" class="detail-title" style="margin-bottom: 16px;">✍️ 新增口袋餐廳</h2>

            <form id="addForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label class="form-label">店名 *</label>
                    <input type="text" id="addName" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">星數評分</label>
                    <select id="addRating" class="form-select">
                        <option value="5">⭐⭐⭐⭐⭐ (5星 - 極推)</option>
                        <option value="4.5">⭐⭐⭐⭐✨ (4.5星)</option>
                        <option value="4" selected>⭐⭐⭐⭐ (4星 - 好吃)</option>
                        <option value="3.5">⭐⭐⭐✨ (3.5星)</option>
                        <option value="3">⭐⭐⭐ (3星)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">地區 (逗號分隔) *</label>
                    <input type="text" id="addDistrict" class="form-input" placeholder="例如: 中環, 港島區" required>
                </div>
                <div class="form-group">
                    <label class="form-label">種類 (逗號分隔) *</label>
                    <input type="text" id="addCategory" class="form-input" placeholder="例如: 甜點/烘焙, 咖啡" required>
                </div>
                <div class="form-group">
                    <label class="form-label">招牌 Preview *</label>
                    <input type="text" id="addSignature" class="form-input" placeholder="例如: 酸種蛋撻" required>
                </div>
                <div class="form-group">
                    <label class="form-label">地址</label>
                    <input type="text" id="addAddress" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">推薦亮點</label>
                    <textarea id="addPros" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">避雷注意</label>
                    <textarea id="addCons" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">提供者 *</label>
                    <input type="text" id="addProvider" class="form-input" placeholder="例如: 朋友阿強" required>
                </div>
                <button type="submit" class="btn-submit">💾 儲存餐廳</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK 引入與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, get, remove, push, child } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        // 你的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyA4o3_qufWsS-8r4cD2YBCXPA4K5ulrdV0",
            authDomain: "fanfan-dou-dim.firebaseapp.com",
            databaseURL: "https://fanfan-dou-dim-default-rtdb.firebaseio.com", // 若有需要可對應你的 RTDB URL
            projectId: "fanfan-dou-dim",
            storageBucket: "fanfan-dou-dim.firebasestorage.app",
            messagingSenderId: "1081553811639",
            appId: "1:1081553811639:web:43a378417da104aeae7532"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.ref = ref;
        window.set = set;
        window.get = get;
        window.remove = remove;
        window.push = push;
        window.child = child;

        window.loadRestaurants();
    </script>

    <script>
        const presetDistricts = ["全部", "港島區", "九龍區", "新界區", "中環", "灣仔", "尖沙咀", "觀塘", "旺角", "外地旅遊"];
        const presetCategories = ["全部", "地道港味", "茶餐廳", "甜點/烘焙", "咖啡/輕食", "日韓台料理", "Bistro/晚餐", "外賣掃街"];

        let activeDistrict = "全部";
        let activeCategory = "全部";
        let restaurantsData = {};
        let currentSelectedId = null;

        function initFilters() {
            document.getElementById('districtFilter').innerHTML = presetDistricts.map(d => 
                `<button class="tag-btn ${d === activeDistrict ? 'active' : ''}" onclick="setDistrict('${d}')">${d}</button>`
            ).join('');

            document.getElementById('categoryFilter').innerHTML = presetCategories.map(c => 
                `<button class="tag-btn ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`
            ).join('');
        }

        window.setDistrict = function(d) {
            activeDistrict = d;
            initFilters();
            renderList();
        }

        window.setCategory = function(c) {
            activeCategory = c;
            initFilters();
            renderList();
        }

        // 從 Firebase 讀取資料
        window.loadRestaurants = function() {
            const dbRef = window.ref(window.db);
            window.get(window.child(dbRef, 'restaurants')).then((snapshot) => {
                if (snapshot.exists()) {
                    restaurantsData = snapshot.val();
                } else {
                    restaurantsData = {};
                }
                initFilters();
                renderList();
            }).catch((error) => {
                console.error(error);
                document.getElementById('restaurantList').innerHTML = `<div class="empty-state">連線雲端資料庫失敗，請檢查設定。</div>`;
            });
        }

        function getStarRating(score) {
            const full = Math.floor(score);
            let s = '★'.repeat(full);
            if (score % 1 !== 0) s += '✨';
            return s;
        }

        window.renderList = function() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const listContainer = document.getElementById('restaurantList');
            const keys = Object.keys(restaurantsData);

            if (keys.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">🥣 還沒有口袋餐廳喔！點右下角 ➕ 新增吧～</div>`;
                return;
            }

            let html = '';
            keys.forEach(id => {
                const item = restaurantsData[id];
                const matchD = (activeDistrict === "全部") || (item.districts && item.districts.some(d => d.includes(activeDistrict)));
                const matchC = (activeCategory === "全部") || (item.categories && item.categories.some(c => c.includes(activeCategory)));
                const matchS = !query || 
                    item.name.toLowerCase().includes(query) ||
                    item.signature.toLowerCase().includes(query) ||
                    item.provider.toLowerCase().includes(query);

                if (matchD && matchC && matchS) {
                    html += `
                        <div class="card" onclick="openDetailModal('${id}')">
                            <div class="card-header">
                                <h3 class="card-title">${item.name}</h3>
                                <div class="stars">${getStarRating(item.rating)}</div>
                            </div>
                            <div class="card-tags">
                                ${(item.districts || []).map(d => `<span class="tag-badge">📍 ${d}</span>`).join('')}
                                ${(item.categories || []).map(c => `<span class="tag-badge">🍴 ${c}</span>`).join('')}
                            </div>
                            <div class="card-preview">
                                <strong>✨ 招牌:</strong> ${item.signature}
                            </div>
                            <div class="provider-tag">👤 ${item.provider}</div>
                        </div>
                    `;
                }
            });

            listContainer.innerHTML = html || `<div class="empty-state">找不到符合條件的餐廳喔！</div>`;
        }

        window.openDetailModal = function(id) {
            currentSelectedId = id;
            const item = restaurantsData[id];
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalStars').innerText = `${getStarRating(item.rating)} (${item.rating}分)`;
            document.getElementById('modalTags').innerHTML = [
                ...(item.districts || []).map(d => `<span class="tag-badge">📍 ${d}</span>`),
                ...(item.categories || []).map(c => `<span class="tag-badge">🍴 ${c}</span>`)
            ].join(' ');

            document.getElementById('modalAddress').innerText = item.address || "未填寫地址";
            document.getElementById('modalSignature').innerText = item.signature;
            document.getElementById('modalPros').innerText = item.pros || "無";
            document.getElementById('modalCons').innerText = item.cons || "無 (表現良好)";
            document.getElementById('modalProvider').innerText = item.provider;

            renderComments(item.comments || {});
            document.getElementById('detailModal').style.display = 'flex';
        }

        window.renderComments = function(commentsObj) {
            const cList = document.getElementById('commentsList');
            const keys = Object.keys(commentsObj);
            if (keys.length === 0) {
                cList.innerHTML = `<div style="font-size:0.8rem; color:#A89F91;">暫無留言，來當第一個留言的朋友吧！</div>`;
                return;
            }
            cList.innerHTML = keys.map(k => {
                const c = commentsObj[k];
                return `<div class="comment-item"><span class="comment-author">${c.author}：</span>${c.text}</div>`;
            }).join('');
        }

        window.addComment = function() {
            const author = document.getElementById('commentAuthor').value.trim();
            const text = document.getElementById('commentText').value.trim();
            if (!author || !text) {
                alert("請填寫名字與留言內容！");
                return;
            }

            const commentRef = window.ref(window.db, `restaurants/${currentSelectedId}/comments`);
            window.push(commentRef, { author, text }).then(() => {
                document.getElementById('commentText').value = '';
                window.loadRestaurants();
                setTimeout(() => openDetailModal(currentSelectedId), 500);
            });
        }

        window.openAddModal = function() {
            document.getElementById('formModalTitle').innerText = "✍️ 新增口袋餐廳";
            document.getElementById('addForm').reset();
            document.getElementById('editId').value = "";
            document.getElementById('addModal').style.display = 'flex';
        }

        window.openEditModal = function() {
            const item = restaurantsData[currentSelectedId];
            if (!item) return;

            document.getElementById('formModalTitle').innerText = "✏️ 編輯口袋餐廳";
            document.getElementById('editId').value = currentSelectedId;
            document.getElementById('addName').value = item.name;
            document.getElementById('addRating').value = item.rating;
            document.getElementById('addDistrict').value = (item.districts || []).join(', ');
            document.getElementById('addCategory').value = (item.categories || []).join(', ');
            document.getElementById('addSignature').value = item.signature;
            document.getElementById('addAddress').value = item.address || "";
            document.getElementById('addPros').value = item.pros || "";
            document.getElementById('addCons').value = item.cons || "";
            document.getElementById('addProvider').value = item.provider;

            closeModal('detailModal');
            document.getElementById('addModal').style.display = 'flex';
        }

        window.handleFormSubmit = function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const id = editId ? editId : 'r_' + Date.now();

            const item = {
                name: document.getElementById('addName').value.trim(),
                rating: parseFloat(document.getElementById('addRating').value),
                districts: document.getElementById('addDistrict').value.split(',').map(s => s.trim()).filter(Boolean),
                categories: document.getElementById('addCategory').value.split(',').map(s => s.trim()).filter(Boolean),
                signature: document.getElementById('addSignature').value.trim(),
                address: document.getElementById('addAddress').value.trim(),
                pros: document.getElementById('addPros').value.trim(),
                cons: document.getElementById('addCons').value.trim(),
                provider: document.getElementById('addProvider').value.trim(),
                comments: restaurantsData[id] ? (restaurantsData[id].comments || {}) : {}
            };

            window.set(window.ref(window.db, 'restaurants/' + id), item).then(() => {
                closeModal('addModal');
                window.loadRestaurants();
                alert("🎉 儲存成功！");
            });
        }

        window.deleteRestaurant = function() {
            if (confirm("確定要刪除這間餐廳嗎？")) {
                window.remove(window.ref(window.db, 'restaurants/' + currentSelectedId)).then(() => {
                    closeModal('detailModal');
                    window.loadRestaurants();
                    alert("🗑️ 已刪除");
                });
            }
        }

        window.closeModal = function(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        window.closeModalOnOverlay = function(e, modalId) {
            if (e.target.id === modalId) closeModal(modalId);
        }
    </script>
</body>
</html>
